<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Home Loan EMI Calculator</title>
<style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; }
    .box { width: 360px; margin: 60px auto; background: #fff; padding: 25px;
           border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    h2 { text-align: center; color: #2c3e50; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #2980b9;
             color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
    <h2>Home Loan EMI Calculator</h2>
    <form action="calculate" method="post">
        <label>House Price / Loan Amount (&#8377;)</label>
        <input type="number" name="price" min="1" step="any" required>

        <label>Annual Interest Rate (%)</label>
        <input type="number" name="rate" min="0" step="any" required>

        <label>Tenure (years)</label>
        <input type="number" name="tenure" min="1" max="40" required>

        <button type="submit">Calculate EMI</button>
    </form>
</div>
</body>
</html>
